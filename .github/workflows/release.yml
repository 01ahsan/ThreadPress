name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publish the extension zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: only this version's section of CHANGELOG.md, plus install steps.
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $VERSION"; exit 1; }
          printf '\nInstall or update: download **ThreadPress-extension.zip** below, extract it over your ThreadPress folder, and click reload on the extensions page.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/ThreadPress-extension.zip dist/store/chrome-edge.zip dist/store/firefox.zip --title "ThreadPress $GITHUB_REF_NAME" --notes-file notes.md
