<!doctype html>
<!-- SYNTHETIC fixture for ChatGPT's 2026 layout: no data-message-author-role; each turn is a
     "group" container announced by a hidden <h4> ("You said:" / "ChatGPT said:"). -->
<html lang="en">
<head><meta charset="utf-8"><title>Quadratic formula - ChatGPT</title></head>
<body>
<nav><a href="/c/x">A different private chat title</a></nav>
<main>
<div class="thread-scroll-container flex flex-col-reverse">
  <div class="thread">
    <section class="group/turn group relative">
      <h4 class="sr-only">You said:</h4>
      <div class="flex justify-end"><div class="user-message-bubble"><div class="whitespace-pre-wrap">Solve x² − 5x + 6 = 0</div></div></div>
      <div class="actions"><button aria-label="Edit message">Edit</button></div>
    </section>
    <section class="group/turn group relative">
      <h4 class="sr-only">ChatGPT said:</h4>
      <div class="markdown prose">
        <p>Use <span class="katex"><span class="katex-mathml"><math><semantics><mrow><mi>x</mi><mo>=</mo><mfrac><mrow><mo>−</mo><mi>b</mi><mo>±</mo><msqrt><mrow><msup><mi>b</mi><mn>2</mn></msup><mo>−</mo><mn>4</mn><mi>a</mi><mi>c</mi></mrow></msqrt></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}</annotation></semantics></math></span></span>.</p>
        <p>So <strong>x = 2</strong> or <strong>x = 3</strong>.</p>
      </div>
      <div class="actions"><button data-testid="copy-turn-action-button">Copy</button></div>
    </section>
  </div>
</div>
</main>
</body>
</html>
