<!doctype html>
<!-- SYNTHETIC fixture mirroring gemini.google.com's Angular markup (2026). -->
<html lang="en">
<head><meta charset="utf-8"><title>Gemini</title></head>
<body>
<side-navigation><div class="conversation selected"><div class="conversation-title">Matrix question</div></div><div class="conversation"><div class="conversation-title">Private other chat</div></div></side-navigation>
<main>
<infinite-scroller class="chat-history">
  <div class="conversation-container" id="c_1">
    <user-query><div class="query-text"><p class="query-text-line">Invert a 2×2 matrix</p></div></user-query>
    <model-response>
      <model-thoughts><div class="thoughts-container"><p>Use the adjugate formula.</p></div></model-thoughts>
      <message-content><div class="markdown markdown-main-panel">
        <p>For <span class="math-inline" data-math="A=\begin{pmatrix}a&amp;b\\c&amp;d\end{pmatrix}"><span class="katex"><span class="katex-mathml"><math><semantics><mrow><mi>A</mi><mo>=</mo><mrow><mo fence="true">(</mo><mtable><mtr><mtd><mi>a</mi></mtd><mtd><mi>b</mi></mtd></mtr><mtr><mtd><mi>c</mi></mtd><mtd><mi>d</mi></mtd></mtr></mtable><mo fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">A=\begin{pmatrix}a&amp;b\\c&amp;d\end{pmatrix}</annotation></semantics></math></span></span></span>:</p>
        <div class="math-block" data-math="A^{-1}=\frac{1}{ad-bc}\begin{pmatrix}d&amp;-b\\-c&amp;a\end{pmatrix}"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math display="block"><semantics><mrow><msup><mi>A</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo>=</mo><mfrac><mn>1</mn><mrow><mi>a</mi><mi>d</mi><mo>−</mo><mi>b</mi><mi>c</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">A^{-1}=\frac{1}{ad-bc}\begin{pmatrix}d&amp;-b\\-c&amp;a\end{pmatrix}</annotation></semantics></math></span></span></span></div>
        <ul><li>Requires <strong>ad − bc ≠ 0</strong></li></ul>
      </div></message-content>
      <div class="response-footer"><mat-icon>thumb_up</mat-icon></div>
    </model-response>
  </div>
</infinite-scroller>
</main>
</body>
</html>
